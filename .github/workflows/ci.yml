name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for Qt, audio and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libdbus-1-3 libfontconfig1 libportaudio2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .
      - name: Tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -ra
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -ra

  build-windows:
    name: Portable Windows exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/aquafonix.spec
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Aquafonix.exe -ArgumentList '--smoke-test', 'smoke.txt' -Wait -PassThru
          Get-Content smoke.txt
          if ($p.ExitCode -ne 0) { throw "smoke test failed (exit $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: Aquafonix-windows
          path: dist/Aquafonix.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aquafonix-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: Aquafonix.exe
          generate_release_notes: true
